description: agent-bench serena config. Read-only symbol tools over one Chromium checkout; files, shell and edits stay with Claude Code.
prompt: |
  You are running inside Claude Code on one Chromium checkout. Claude Code's own tools read, search, edit and run
  commands. Serena gives you language-server symbol tools only: overview of a file's symbols, a symbol's body,
  its references, declaration and implementations, and a file's diagnostics. Pass a relative_path to every call:
  a search without one walks the whole checkout and does not finish.
fixed_tools:
  - initial_instructions
  - get_symbols_overview
  - find_symbol
  - find_referencing_symbols
  - find_declaration
  - find_implementations
  - get_diagnostics_for_file
tool_description_overrides: {}
single_project: true
structured_tool_output: false
